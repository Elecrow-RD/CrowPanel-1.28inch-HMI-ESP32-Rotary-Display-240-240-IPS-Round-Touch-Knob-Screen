esphome:
  name: 128-touch
  friendly_name: 1.28 Touch
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  on_boot:
    priority: 800
    then:
      - logger.log: "Display backlight on"
      - output.turn_on: gpio_3_backlight_pwm
      - delay: 200ms
      - output.turn_off: power_light
      - output.turn_on: out1
      - output.turn_on: out2
      - light.turn_on:
          id: back_light
          brightness: 50%
      - lambda: |-
          id(encoder_ready) = false;
          id(brightness_value) = 50;
          id(knob).publish_state(0);
      - delay: 500ms
      - lvgl.arc.update:
          id: arc_brightness
          value: 50
      - lvgl.label.update:
          id: lbl_brightness
          text: "50%"
      - delay: 200ms
      - lambda: |-
          id(encoder_ready) = true;

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    version: recommended

psram:
  mode: octal
  speed: 80MHz

logger:
  level: VERY_VERBOSE

api:
  encryption:
    key: "VmY+BKq+nT9tNLvuVoLeMcQngJNXTG3fiFRMpI9ywmE="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ThinkNode-G4-2a2d82"
    password: "elecrow.com"

captive_portal:

i2c:
  - id: touch_i2c_bus
    sda: GPIO6
    scl: GPIO7
    scan: true
    frequency: 400kHz
  - id: main_i2c_bus
    sda: GPIO38
    scl: GPIO39
    scan: true
    frequency: 400kHz

spi:
  id: spi_bus
  mosi_pin: GPIO11
  clk_pin: GPIO10

display:
  - platform: ili9xxx
    id: round_display
    model: GC9A01A
    spi_id: spi_bus
    cs_pin: GPIO9
    dc_pin: GPIO3
    reset_pin: GPIO14
    invert_colors: true
    dimensions: 240x240
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: cst816
    id: my_touchscreen
    i2c_id: touch_i2c_bus
    display: round_display
    
    reset_pin: GPIO13
    skip_probe: true
    update_interval: 30ms
    calibration:
      x_min: 0
      x_max: 240
      y_min: 0
      y_max: 240
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    on_touch:
      - logger.log:
          format: "Touch x=%d y=%d raw_x=%d raw_y=%d"
          args: [touch.x, touch.y, touch.x_raw, touch.y_raw]
      - lvgl.label.update:
          id: lbl_hint
          text:
            format: "Touch %d,%d"
            args: [touch.x, touch.y]
    on_update:
      - lambda: |-
          for (auto touch: touches) {
            if (touch.state <= 2) {
              ESP_LOGI("touch_update", "id=%d state=%d x=%d y=%d raw_x=%d raw_y=%d",
                       touch.id, touch.state, touch.x, touch.y, touch.x_raw, touch.y_raw);
            }
          }
    on_release:
      - logger.log: "Touch released"
      - lvgl.label.update:
          id: lbl_hint
          text: "Released"

globals:
  - id: brightness_value
    type: int
    restore_value: false
    initial_value: "50"
  - id: encoder_ready
    type: bool
    restore_value: false
    initial_value: "false"

output:
  - platform: ledc
    pin: GPIO46
    id: gpio_3_backlight_pwm
    frequency: 5000Hz
  - platform: gpio
    id: power_light
    pin: GPIO40
  - platform: gpio
    id: out1
    pin: GPIO1
  - platform: gpio
    id: out2
    pin: GPIO2

light:
  - platform: monochromatic
    name: "Display Backlight"
    output: gpio_3_backlight_pwm
    id: back_light
    restore_mode: ALWAYS_ON

sensor:
  - platform: rotary_encoder
    id: knob
    name: "Encoder"
    pin_a:
      number: GPIO45
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO42
      mode:
        input: true
        pullup: true
    resolution: 1
    filters:
      - debounce: 20ms
      - lambda: return round(x);
    on_value:
      then:
        - lambda: |-
            if (!id(encoder_ready)) return;

            static bool first_run = true;
            static int last_encoder = 0;
            const int current = (int) id(knob).state;

            if (first_run) {
              last_encoder = current;
              first_run = false;
              return;
            }

            const int delta = current - last_encoder;
            last_encoder = current;
            if (delta == 0) return;

            id(brightness_value) += delta > 0 ? 5 : -5;
            if (id(brightness_value) < 0) id(brightness_value) = 0;
            if (id(brightness_value) > 100) id(brightness_value) = 100;

            id(gpio_3_backlight_pwm).set_level(id(brightness_value) / 100.0f);
        - lvgl.arc.update:
            id: arc_brightness
            value: !lambda return id(brightness_value);
        - lvgl.label.update:
            id: lbl_brightness
            text:
              format: "%d%%"
              args: [id(brightness_value)]

binary_sensor:
  - platform: touchscreen
    name: "Screen Touch Active"
    touchscreen_id: my_touchscreen
    x_min: 0
    x_max: 240
    y_min: 0
    y_max: 240
    on_press:
      - logger.log: "Full screen touch area pressed"
    on_release:
      - logger.log: "Full screen touch area released"

font:
  - file: "gfonts://Montserrat"
    id: montserrat_14
    size: 14
  - file: "gfonts://Montserrat"
    id: montserrat_20
    size: 20
  - file: "gfonts://Montserrat"
    id: montserrat_36
    size: 36

lvgl:
  displays:
    - round_display
  touchscreens:
    - touchscreen_id: my_touchscreen
  buffer_size: 25%
  bg_color: 0x000000
  widgets:
    - obj:
        align: CENTER
        width: 240
        height: 240
        bg_color: 0x070707
        bg_opa: "100%"
        border_width: 0
        pad_all: 0
        radius: 120
    - label:
        id: lbl_title
        align: CENTER
        y: -48
        text_font: montserrat_14
        text: "Brightness"
        text_color: 0xFFFFFF
    - arc:
        id: arc_brightness
        align: CENTER
        width: 176
        height: 176
        min_value: 0
        max_value: 100
        value: 50
        adjustable: true
        start_angle: 135
        end_angle: 45
        arc_color: 0x2C2C2C
        arc_width: 14
        arc_rounded: true
        indicator:
          arc_color: 0x00D2FF
          arc_width: 14
          arc_rounded: true
        knob:
          bg_color: 0xFFFFFF
          bg_opa: "100%"
          radius: 10
          pad_all: 3
        on_value:
          then:
            - lambda: |-
                id(brightness_value) = lv_arc_get_value(id(arc_brightness));
                if (id(brightness_value) < 0) id(brightness_value) = 0;
                if (id(brightness_value) > 100) id(brightness_value) = 100;
                id(gpio_3_backlight_pwm).set_level(id(brightness_value) / 100.0f);
            - lvgl.label.update:
                id: lbl_brightness
                text:
                  format: "%d%%"
                  args: [id(brightness_value)]
    - label:
        id: lbl_brightness
        align: CENTER
        text_font: montserrat_36
        text: "50%"
        text_color: 0xFFFFFF
    - label:
        id: lbl_hint
        align: CENTER
        y: 52
        text_font: montserrat_14
        text: "Touch or rotate"
        text_color: 0x7A8490
